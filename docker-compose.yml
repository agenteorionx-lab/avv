services:
  avv-portal:
    image: avv-portal-app:latest
    networks:
      - traefik_public
    ports:
      - "3006:3006"
    env_file:
      - .env
    environment:
      - PORT=3006
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"

        # Roteamento exclusivo para o domínio oficial avvvoleibol.com.br
        - "traefik.http.routers.avv-domain.rule=Host(`avvvoleibol.com.br`) || Host(`www.avvvoleibol.com.br`)"
        - "traefik.http.routers.avv-domain.entrypoints=websecure"
        - "traefik.http.routers.avv-domain.tls=true"
        - "traefik.http.routers.avv-domain.tls.certresolver=le"
        - "traefik.http.routers.avv-domain.service=avv-portal-svc"

        - "traefik.http.services.avv-portal-svc.loadbalancer.server.port=3006"

networks:
  traefik_public:
    external: true
